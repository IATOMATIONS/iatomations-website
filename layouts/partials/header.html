<header class="site-header" role="banner">
  <nav class="container" role="navigation" aria-label="Main navigation">
    <div class="logo">
      <a href="{{ .Site.BaseURL }}" aria-label="IATOMATIONS - Inicio">
        <img src="{{ "images/logo-iatomations.png" | absURL }}" alt="IATOMATIONS Logo" height="40" width="140" loading="eager">
      </a>
    </div>
    <button class="mobile-menu-btn" aria-expanded="false" aria-controls="nav-menu" aria-label="Abrir menú">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
    <ul id="nav-menu" class="nav-links" role="menubar">
      <li role="none"><a href="{{ "solutions" | relURL }}" role="menuitem">Solutions</a></li>
      <li role="none"><a href="{{ "cases" | relURL }}" role="menuitem">Case Studies</a></li>
      <li role="none"><a href="{{ "blog" | relURL }}" role="menuitem">Blog</a></li>
      <li role="none"><a href="{{ "contact" | relURL }}" role="menuitem">Contact</a></li>
      <li role="none"><a href="{{ "es" | relURL }}" role="menuitem">ES</a></li>
    </ul>
  </nav>
</header>

<script defer>
  document.addEventListener('DOMContentLoaded', function() {
    const btn = document.querySelector('.mobile-menu-btn');
    const menu = document.querySelector('.nav-links');
    if (btn && menu) {
      btn.addEventListener('click', function() {
        const expanded = btn.getAttribute('aria-expanded') === 'true';
        btn.setAttribute('aria-expanded', !expanded);
        menu.classList.toggle('active');
      });
    }
  });
</script>
