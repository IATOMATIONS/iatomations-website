{{ define "main" }}
<section>
  <div class="container">
    <h1>{{ .Title }}</h1>
    {{ .Content }}
  </div>
</section>

<!-- Contact Form Integration -->
<section id="contact" style="background: var(--bg-alt);">
  <div class="container">
    <h2>Get in Touch</h2>
    <div class="contact-form">
      <form action="https://formsubmit.co/info@iatomations.com" method="POST">
        <input type="hidden" name="_subject" value="New contact from IATOMATIONS website">
        <input type="hidden" name="_captcha" value="false">
        
        <div class="form-group">
          <label for="name">Full Name *</label>
          <input type="text" id="name" name="name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
          <label for="company">Company</label>
          <input type="text" id="company" name="company">
        </div>
        
        <div class="form-group">
          <label for="service">Service Interested In</label>
          <select id="service" name="service">
            <option value="">Select a service...</option>
            <option value="audit">Free Digital Audit</option>
            <option value="ecommerce">E-Commerce Automation</option>
            <option value="ai">AI Agent Development</option>
            <option value="web">Web Development</option>
            <option value="other">Other</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="message">Message *</label>
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Send Message</button>
      </form>
    </div>
  </div>
</section>
{{ end }}
