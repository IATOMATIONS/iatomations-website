{{ define "main" }}
<section class="page-content">
  <div class="container">
    <div class="content">
      <h1>{{ .Title }}</h1>
      {{ .Content }}
      <ul>
      {{ range .Pages }}
        <li><a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
      {{ end }}
      </ul>
    </div>
  </div>
</section>
{{ end }}
