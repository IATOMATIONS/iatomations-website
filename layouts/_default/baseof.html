<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ .Params.description | default .Site.Params.description }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }}{{ end }}">
  <meta property="og:description" content="{{ .Params.description | default .Site.Params.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07080a;
      --bg-card: #0d0f13;
      --bg-elevated: #14161c;
      --border: #1e2230;
      --text: #e2e4e9;
      --text-secondary: #888d9b;
      --accent: #6d44d2;
      --accent-light: #8b6be6;
      --accent-glow: rgba(109,68,210,0.15);
      --success: #34d399;
      --radius: 12px;
      --radius-lg: 20px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 24px; }

    /* HEADER */
    header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      background: rgba(7,8,10,0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      padding: 0;
    }
    nav { display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .logo { font-size: 1.3rem; font-weight: 700; color: #fff; text-decoration: none; letter-spacing: -0.5px; }
    .logo span { color: var(--accent-light); }
    .nav-links { display: flex; list-style: none; gap: 2rem; align-items: center; }
    .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.2s; }
    .nav-links a:hover { color: #fff; }
    .nav-cta {
      background: var(--accent); color: #fff !important; padding: 8px 20px; border-radius: 8px;
      font-weight: 600; font-size: 0.85rem !important; transition: all 0.2s !important;
    }
    .nav-cta:hover { background: var(--accent-light); transform: translateY(-1px); }
    .mobile-menu-btn { display: none; background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; }

    /* HERO */
    .hero {
      padding: 160px 0 80px;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: radial-gradient(circle at 50% 50%, var(--accent-glow) 0%, transparent 50%);
      pointer-events: none;
    }
    .hero-content { position: relative; max-width: 800px; margin: 0 auto; text-align: center; }
    .hero-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(109,68,210,0.1); border: 1px solid rgba(109,68,210,0.25);
      padding: 6px 16px; border-radius: 100px; font-size: 0.8rem; color: var(--accent-light);
      margin-bottom: 24px; font-weight: 500;
    }
    .hero h1 { font-size: clamp(2.5rem, 5vw, 4.2rem); font-weight: 800; line-height: 1.1; margin-bottom: 20px; letter-spacing: -1.5px; }
    .hero h1 span { color: var(--accent-light); }
    .hero p { font-size: 1.15rem; color: var(--text-secondary); max-width: 640px; margin: 0 auto 36px; line-height: 1.7; }
    .hero-buttons { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    .btn-primary {
      display: inline-flex; align-items: center; gap: 8px;
      background: var(--accent); color: #fff; padding: 14px 32px; border-radius: 10px;
      text-decoration: none; font-weight: 600; font-size: 0.95rem;
      transition: all 0.2s;
    }
    .btn-primary:hover { background: var(--accent-light); transform: translateY(-2px); box-shadow: 0 8px 30px var(--accent-glow); }
    .btn-secondary {
      display: inline-flex; align-items: center; gap: 8px;
      background: transparent; color: #fff; padding: 14px 32px; border-radius: 10px;
      text-decoration: none; font-weight: 600; font-size: 0.95rem;
      border: 1px solid var(--border); transition: all 0.2s;
    }
    .btn-secondary:hover { border-color: var(--text-secondary); background: var(--bg-card); }

    /* SECTIONS */
    section { padding: 80px 0; }
    .section-label {
      font-size: 0.75rem; text-transform: uppercase; letter-spacing: 2px;
      color: var(--accent-light); font-weight: 600; margin-bottom: 12px;
    }
    .section-title { font-size: clamp(1.8rem, 3vw, 2.5rem); font-weight: 700; margin-bottom: 16px; letter-spacing: -0.5px; }
    .section-desc { color: var(--text-secondary); max-width: 600px; font-size: 1.05rem; line-height: 1.7; margin-bottom: 48px; }

    /* PROBLEM SECTION */
    .problem-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: center; }
    .problem-list { list-style: none; display: flex; flex-direction: column; gap: 16px; }
    .problem-item {
      display: flex; align-items: flex-start; gap: 14px;
      background: var(--bg-card); padding: 16px 20px; border-radius: var(--radius);
      border: 1px solid var(--border); font-size: 0.95rem; line-height: 1.5;
    }
    .problem-icon { width: 24px; height: 24px; min-width: 24px; border-radius: 6px; background: rgba(239,68,68,0.1); display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
    .problem-image img { width: 100%; border-radius: var(--radius-lg); border: 1px solid var(--border); }

    /* SOLUTIONS GRID */
    .solutions-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .solution-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px; transition: all 0.2s;
    }
    .solution-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
    .solution-number { font-size: 2.5rem; font-weight: 800; color: var(--accent); opacity: 0.3; line-height: 1; margin-bottom: 12px; }
    .solution-card h3 { font-size: 1.2rem; margin-bottom: 10px; }
    .solution-card p { color: var(--text-secondary); font-size: 0.9rem; line-height: 1.6; margin-bottom: 16px; }
    .solution-card a { color: var(--accent-light); text-decoration: none; font-weight: 500; font-size: 0.9rem; }
    .solution-card a:hover { text-decoration: underline; }

    /* CTA */
    .cta-section {
      background: linear-gradient(135deg, var(--accent-glow), transparent);
      border: 1px solid var(--border); border-radius: var(--radius-lg);
      padding: 64px; text-align: center; margin-top: 40px;
    }
    .cta-section h2 { font-size: clamp(1.5rem, 2.5vw, 2rem); margin-bottom: 12px; }
    .cta-section p { color: var(--text-secondary); margin-bottom: 28px; }

    /* HOW IT WORKS */
    .steps-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .step-card { text-align: center; padding: 32px 24px; }
    .step-number {
      width: 48px; height: 48px; border-radius: 50%; background: var(--accent);
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 1.1rem; margin: 0 auto 16px;
    }
    .step-card h4 { font-size: 1.05rem; margin-bottom: 8px; }
    .step-card p { color: var(--text-secondary); font-size: 0.9rem; }

    /* CASES */
    .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .case-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      overflow: hidden; text-decoration: none; color: inherit; transition: all 0.2s;
    }
    .case-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .case-card img { width: 100%; height: 200px; object-fit: cover; }
    .case-card-body { padding: 20px 24px; }
    .case-card h3 { font-size: 1rem; margin-bottom: 4px; }
    .case-card p { color: var(--text-secondary); font-size: 0.85rem; }

    /* TESTIMONIALS */
    .testimonials-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .testimonial-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 32px;
    }
    .testimonial-card blockquote { color: var(--text); font-style: italic; margin-bottom: 16px; line-height: 1.6; font-size: 0.95rem; }
    .testimonial-card .attribution { color: var(--text-secondary); font-size: 0.85rem; font-style: normal; }

    /* PAGE CONTENT (for non-home pages) */
    .page-content { padding: 140px 0 80px; }
    .page-content .content { max-width: 800px; margin: 0 auto; }
    .page-content .content h1 { font-size: 2.5rem; margin-bottom: 24px; }
    .page-content .content h2 { font-size: 1.5rem; margin: 40px 0 16px; }
    .page-content .content h3 { font-size: 1.2rem; margin: 24px 0 12px; }
    .page-content .content p { margin-bottom: 16px; color: var(--text-secondary); }
    .page-content .content a { color: var(--accent-light); }
    .page-content .content img { max-width: 100%; border-radius: var(--radius); margin: 24px 0; border: 1px solid var(--border); }
    .page-content .content ul, .page-content .content ol { margin: 16px 0; padding-left: 24px; color: var(--text-secondary); }
    .page-content .content li { margin-bottom: 8px; }
    .page-content .content blockquote {
      border-left: 3px solid var(--accent); padding: 16px 24px; margin: 24px 0;
      background: var(--bg-card); border-radius: 0 var(--radius) var(--radius) 0;
      color: var(--text-secondary); font-style: italic;
    }

    /* FOOTER */
    footer { border-top: 1px solid var(--border); padding: 40px 0; margin-top: 40px; }
    footer .container { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; }
    footer p { color: var(--text-secondary); font-size: 0.85rem; }
    footer a { color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; }
    footer a:hover { color: #fff; }

    /* RESPONSIVE */
    @media (max-width: 768px) {
      .mobile-menu-btn { display: block; }
      .nav-links { display: none; }
      .problem-grid, .solutions-grid, .cases-grid, .testimonials-grid { grid-template-columns: 1fr; }
      .steps-grid { grid-template-columns: 1fr; }
      .cta-section { padding: 40px 24px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <nav>
        <a href="/" class="logo">IATOM<span>ATIONS</span></a>
        <ul class="nav-links">
          {{- $current := .RelPermalink -}}
          <li><a href="/"{{ if eq $current "/" }} style="color:#fff;"{{ end }}>Home</a></li>
          <li><a href="/solutions/"{{ if hasPrefix $current "/solutions" }} style="color:#fff;"{{ end }}>Solutions</a></li>
          <li><a href="/blog/"{{ if hasPrefix $current "/blog" }} style="color:#fff;"{{ end }}>Blog</a></li>
          <li><a href="/contact/"{{ if eq $current "/contact/" }} style="color:#fff;"{{ end }}>Contact</a></li>
          <li><a href="/audit/" class="nav-cta">Get Free Audit</a></li>
        </ul>
        <button class="mobile-menu-btn">☰</button>
      </nav>
    </div>
  </header>
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  <footer>
    <div class="container">
      <p>&copy; {{ now.Format "2006" }} {{ .Site.Title }}. All rights reserved.</p>
      <a href="/privacy/">Privacy Policy</a>
    </div>
  </footer>
</body>
</html>
